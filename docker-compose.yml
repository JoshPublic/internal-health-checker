services:
  health-alpha:
    build:
      context: .
    environment:
      SERVICE_NAME: health-alpha
      SERVICE_VERSION: 1.0.0
      SERVICE_STATUS: ok
      PORT: 8080
      MONITORED_TARGETS: health-beta=http://health-beta:8080/health
      CHECK_INTERVAL_SECONDS: 15
      ALERT_MODE: log
      ALERT_WEBHOOK_URL: ""
      LOG_LEVEL: info
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  health-beta:
    build:
      context: .
    environment:
      SERVICE_NAME: health-beta
      SERVICE_VERSION: 1.0.0
      SERVICE_STATUS: ok
      PORT: 8080
      MONITORED_TARGETS: health-alpha=http://health-alpha:8080/health
      CHECK_INTERVAL_SECONDS: 15
      ALERT_MODE: log
      ALERT_WEBHOOK_URL: ""
      LOG_LEVEL: info
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
